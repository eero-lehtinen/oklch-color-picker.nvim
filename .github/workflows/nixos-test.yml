name: NixOS integration test

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  nixos:
    name: NixOS (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        backend: [x11, wayland]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check out Nixpkgs with the proposed plugin override
        uses: actions/checkout@v7
        with:
          repository: eero-lehtinen/nixpkgs
          ref: efc5e5817510b06f3e9ea8879755b9ba2ca8cf63 # oklch-color-picker-nvim-test
          path: nixpkgs

      - name: Install Nix and configure KVM
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Check hardware virtualization
        run: test -r /dev/kvm && test -w /dev/kvm

      - name: Build NixOS test driver
        run: |
          mkdir -p test-results
          nix-build tests/nixos -A driver \
            --arg nixpkgs ./nixpkgs \
            --arg pluginSrc ./. \
            --argstr backend '${{ matrix.backend }}' \
            --out-link nixos-test-driver 2>&1 | tee test-results/build.log

      - name: Run NixOS integration test
        run: |
          nixos-test-driver/bin/nixos-test-driver \
            -o "$PWD/test-results" 2>&1 | tee test-results/test.log

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nixos-test-results-${{ matrix.backend }}
          path: test-results/
          if-no-files-found: ignore
